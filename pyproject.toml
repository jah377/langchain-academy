[project]
name = "langchain-academy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonHarris-OMC", email = "jon.harris@omc.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.4",
    "cryptography>=46.0.7",
    "ipykernel>=7.3.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.2.28",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.14",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.4",
    "langsmith>=0.7.31",
    "notebook>=7.6.2",
    "pip-system-certs>=5.3",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.3",
    "tavily>=1.1.0",
    "tavily-python>=0.8.0",
    "trustcall>=0.0.39",
    "wikipedia>=1.4.0",
]

[project.scripts]
langchain-academy = "langchain_academy:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
